name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Arquivos do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Todo arquivo citado existe em public/
        run: node scripts/check-site.mjs
